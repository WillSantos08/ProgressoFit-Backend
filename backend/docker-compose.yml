version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: progressofit-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d progressofit-db"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data: